name: Checks

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_images:
    permissions:  # required by the reusable workflow
      contents: read
      packages: write
    uses: ./.github/workflows/component-build-images.yml
    with:
      push: ${{ github.event_name == 'push' }}
      # Use a non-release tag for PR builds; tags are not pushed when push=false.
      version: ${{ github.event_name == 'push' && 'main' || 'dev' }}
    secrets: inherit

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6.0.2
      - name: install dependencies
        run: npm install
      - name: run markdownlint
        run: make markdownlint

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: install yamllint
        run: make install-yamllint
      - name: run yamllint
        run: yamllint . -f github

  misspell:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6.0.2
      - name: run misspell
        run: make misspell

  checklinks:
    name: linkspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Run linkspector
        uses: umbrelladocs/action-linkspector@v1
        with:
          level: info
          fail_level: any
          config_file: '.linkspector.yml'

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: run sanitycheck.py
        run: python3 ./internal/tools/sanitycheck.py

  checklicense:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6.0.2
      - name: run checklicense
        run: make checklicense

  procrustes-preflight:
    name: Procrustes static preflight
    runs-on: ubuntu-latest
    steps:
      - name: check out OpenTelemetry Demo
        uses: actions/checkout@v6.0.2
      - name: check out Procrustes
        uses: actions/checkout@v6.0.2
        with:
          repository: MB3R-Lab/Procrustes
          ref: main
          path: .procrustes-source
      - name: set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.2'
          cache-dependency-path: .procrustes-source/go.sum
      - name: build Procrustes
        working-directory: .procrustes-source
        run: go build -o ../procrustes-bin ./cmd/procrustes
      - name: analyze checkout static eligibility
        run: >-
          ./procrustes-bin analyze
          --source k8s=kubernetes
          --source tests=test/tracetesting
          --source preflight=mb3r/config/procrustes
          --goal mb3r/config/procrustes/goal.yaml
          --out-dir mb3r/out/procrustes
          --fail-on-blocked
      - name: add Procrustes result to job summary
        if: always()
        run: cat mb3r/out/procrustes/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: upload Procrustes report
        if: always()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: opentelemetry-demo-procrustes-preflight
          path: mb3r/out/procrustes

  build-test:
    needs: [
      build_images,
      markdownlint,
      yamllint,
      misspell,
      checklinks,
      sanity,
      checklicense,
      procrustes-preflight
    ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Report CI status
        shell: bash
        env:
          CI_SUCCESS: ${{ !contains(needs.*.result, 'failure') }}
        run: |
          if [ "${CI_SUCCESS}" == "true" ]
          then
            echo 'Build complete ✓'
          else
            echo 'Build failed ✗'
            exit 1
          fi
